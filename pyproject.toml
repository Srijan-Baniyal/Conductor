[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agent-harness"
version = "0.1.0"
description = "A small, model-agnostic agent harness: tools, memory, context and an action loop, configured by TOML."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tools = ["sympy>=1.12", "numpy", "matplotlib"]
dev = ["pytest"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["agents/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
